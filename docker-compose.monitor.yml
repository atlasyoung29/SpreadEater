services:
  monitor-postgres:
    image: postgres:16-alpine
    container_name: spreadeater-monitor-postgres
    environment:
      POSTGRES_DB: spreadeater_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - spreadeater-monitor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spreadeater_monitor"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  spreadeater-monitor-postgres:
